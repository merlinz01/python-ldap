# NOTE: Configuration has been moved to pyproject.toml
#
# To customize the C extension build, edit the [tool.python-ldap.config]
# section in pyproject.toml instead of this file.
#
# This file is kept only for legacy setuptools commands (install, bdist_rpm).

# Installation options
[install]
compile = 1
optimize = 1

# Linux distributors/packagers should adjust these settings
[bdist_rpm]
provides = python-ldap
requires = python libldap-2
vendor = python-ldap project
packager = python-ldap team
distribution_name = openSUSE 11.x
release = 1
doc_files = CHANGES README INSTALL TODO Demo/
