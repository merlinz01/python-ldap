[project]
name = "python-ldap"
license.text = "python-ldap"  # TODO: Replace with SPDX expression (requires setuptools 77+)
dynamic = ["version"]
description = "Python modules for implementing LDAP clients"
authors = [
    {name = "python-ldap project", email = "python-ldap@python.org"},
]
readme = "README"
requires-python = ">=3.9"
keywords = ["ldap", "directory", "authentication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
    "License :: OSI Approved :: Python Software Foundation License",
]
dependencies = [
    "pyasn1 >= 0.3.7",
    "pyasn1_modules >= 0.1.5",
]

[project.optional-dependencies]
dev = [
    "ruff >= 0.14.0",
]
test = [
    "pytest >= 7.0.0",
    "pytest-cov >= 4.0.0",
    "coverage[toml] >= 7.0.0",
    "tox>=4.30.3",
]
docs = [
    "sphinx >= 5.0.0",
    "sphinxcontrib-spelling >= 8.0.0",
    "markdown >= 3.0.0",
]

[project.urls]
Homepage = "https://www.python-ldap.org/"
Documentation = "https://python-ldap.readthedocs.io/"
Repository = "https://github.com/python-ldap/python-ldap"
Download = "https://pypi.org/project/python-ldap/"
Changelog = "https://github.com/python-ldap/python-ldap/blob/main/CHANGES"

[build-system]
requires = [
    "setuptools",
    "tomli >= 1.0.0 ; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true
license-files = ["LICENCE", "LICENCE.MIT"]
py-modules = ["ldapurl", "ldif"]
package-dir = {"" = "Lib"}
packages = { find = { where = ["Lib"] } }
dynamic = { version = {attr = "ldap.pkginfo.__version__"} }

[tool.python-ldap.config]
sources = []
# Uncomment and customize these for your platform if needed:
# library_dirs = ["/usr/lib", "/usr/lib64", "/usr/local/lib"]
# include_dirs = ["/usr/include", "/usr/local/include"]
# libs = ["ldap", "lber"]
# libs = ["ldap_r", "lber"] # thread-safe libldap_r
defines = ["HAVE_SASL", "HAVE_TLS"]
extra_compile_args = []
extra_objects = []


# Ruff - Modern Python linter and formatter
# Replaces: black, isort, flake8, and more
[tool.ruff]
target-version = "py39"
line-length = 88
src = ["Lib", "Demo", "Doc", "Tests", "setup.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "N801",   # class name should use CapWords convention (TestCase etc. are mixed case)
    "N802",   # function name should be lowercase (LDAP uses mixed case)
    "N803",   # argument name should be lowercase (LDAP uses mixed case)
    "N806",   # variable in function should be lowercase
    "N815",   # variable in class scope should be lowercase (used in tests)
    "N816",   # variable in function scope should not be mixedCase (used in demos)
    "N818",   # error class names should end with 'Error'
    "N999",   # invalid module name (Tests)
]

[tool.ruff.lint.isort]
known-first-party = ["ldap", "_ldap", "ldapurl", "ldif", "slapdtest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = [
    "ldap",
    "ldif",
    "ldapurl",
    "slapdtest",
]

[tool.coverage.paths]
source = [
    "Lib/",
    ".tox/*/lib/python*/site-packages/",
]

[tool.coverage.report]
ignore_errors = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "build/htmlcov"
title = "python-ldap coverage report"

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["t_*.py"]
filterwarnings = [
    "error",
    "ignore::ldap.LDAPBytesWarning",
]
